name: lua-compat-matrix
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        # Quote -DLUA_VERSION: Windows pwsh splits 5.4 at the dot.
        # Vendored trees: 3rd/lua-5.1.5 … 3rd/lua-5.4.8 (required by CMakeLists).
        run: cmake -S . -B build -A x64 "-DLUA_VERSION=${{ matrix.lua }}"
      - name: Build
        run: cmake --build build --config Release --target lua asyncsocket luadap
      - name: Stage bin for tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $src = $null
          foreach ($d in @("build/bin", "bin")) {
            if (Test-Path (Join-Path $d "lua.exe")) {
              $src = $d
              break
            }
          }
          if (-not $src) { throw "lua.exe not found after build (tried build/bin and bin)" }
          if ($src -ne "bin") {
            Copy-Item -Force (Join-Path $src "lua.exe") bin/
            Copy-Item -Force (Join-Path $src "asyncsocket.dll") bin/
            Copy-Item -Force (Join-Path $src "luadap.dll") bin/
          }
          foreach ($name in @("lua.exe", "asyncsocket.dll", "luadap.dll")) {
            if (-not (Test-Path (Join-Path "bin" $name))) {
              throw "missing bin/$name after stage (src=$src)"
            }
          }
      - name: Tests
        shell: pwsh
        run: |
          $env:PATH = "$pwd/bin;$env:PATH"
          python test/test_asyncsocket_smoke.py
          python test/test_dap_luadap_handshake.py
          python test/test_dap_evaluate.py
          python test/test_dap_condition.py
