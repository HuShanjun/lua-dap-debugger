name: lua-compat-matrix
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        # Quote -DLUA_VERSION: Windows pwsh splits 5.4 at the dot.
        # Vendored trees: 3rd/lua-5.1.5 … 3rd/lua-5.4.8 (required by CMakeLists).
        run: cmake -S . -B build -A x64 "-DLUA_VERSION=${{ matrix.lua }}"
      - name: Build
        run: cmake --build build --config Release --target lua asyncsocket luadap
      - name: Stage bin for tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $ver = "${{ matrix.lua }}"
          $luaDir = Join-Path "bin" ("lua" + $ver)
          if (-not (Test-Path (Join-Path $luaDir "lua.exe"))) {
            throw "lua.exe not found in $luaDir after build"
          }
          # Tests / PATH expect flat bin/lua.exe alongside DLL modules.
          Copy-Item -Force (Join-Path $luaDir "lua.exe") bin/
          foreach ($name in @("asyncsocket.dll", "luadap.dll")) {
            if (-not (Test-Path (Join-Path "bin" $name))) {
              throw "missing bin/$name after build"
            }
          }
          if (-not (Test-Path "bin/lua.exe")) {
            throw "missing bin/lua.exe after stage"
          }
      - name: Tests
        shell: pwsh
        run: |
          $env:PATH = "$pwd/bin;$env:PATH"
          python test/test_asyncsocket_smoke.py
          python test/test_dap_luadap_handshake.py
          python test/test_dap_evaluate.py
          python test/test_dap_condition.py
